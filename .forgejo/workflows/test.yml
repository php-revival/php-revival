name: Test
enable-email-notifications: true

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    run-test:
        runs-on: burn
        name: Build and run tests

        steps:
            - uses: actions/checkout@v4

            - name: Build
              run: |
                  npm ci
                  npm run prod

            - name: Test
              run: npm test
