name: Test
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-run-test:
    runs-on: podman
    container: docker.io/library/node:26
    name: Build and run tests

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          npm ci
          npm run prod

      - name: Test
        run: npm test
